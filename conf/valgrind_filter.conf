################################################################################
# BAD_PARAM  | Syscall param write(buf) points to uninitialised byte(s)
# COPY_UNINIT_MEM | Conditional jump or move depends on uninitialised value(s)
# WRITE_INVALID_MEM | Invalid write of size
# READ_INVALID_MEM | Invalid read of size
# USE_UNINIT_MEM | Use of uninitialised value of size
# COPY_UNINIT_PTR | Uninitialised value was created by a stack allocation
# BAD_FREE | Invalid free() / delete / delete[]
# MISMATCH_FREE | Mismatched free() / delete / delete[]
# OVERLAP_MEM | Source and destination overlap in memory
# NEGATIVE_SIZE_ALLOC | Argument 'size' of function malloc has a fishy ( possibly negative ) value
# POSSIBLY_LOST | XX bytes in X blocks are possibly lost in loss record X of X
# DEFINITELY_LOST | XX bytes in X blocks are definitely lost in loss record X of X
################################################################################

