# Turn on tracing of internal errors and deprecated options
trace enable tracepoints "error deprecated"

# Enable TCP/IP connections
interface tcp library STAFTCP OPTION PORT=6500 

# Set default local trust
trust default level 5

# Add default service loader
serviceloader library STAFDSLS

# Add ADS service
#SERVICE ads LIBRARY STAFads

# Add ATS service
SERVICE ats LIBRARY STAFats

SET SYSTEM VAR ATAF_DEBUG=0
SET SYSTEM VAR ATAF_EVENT_TIMEOUT=30000
SET SYSTEM VAR ATAF_MEMORY_TEST=0

#SET DEFAULTSHELL "C:\\cygwin\\bin\\bash.exe -c %C"
SET DEFAULTSHELL "/usr/local/bin/bash -c %C"

# Add STAX service
SERVICE STAX LIBRARY JSTAF EXECUTE {STAF/Config/STAFRoot}/lib/STAX.jar OPTION J2=-Xmx384m
SERVICE EVENT LIBRARY JSTAF EXECUTE {STAF/Config/STAFRoot}/lib/STAFEvent.jar
SERVICE EVENTMANAGER LIBRARY JSTAF EXECUTE {STAF/Config/STAFRoot}/lib/STAFEventManager.jar
SERVICE CRON LIBRARY JSTAF EXECUTE {STAF/Config/STAFRoot}/lib/STAFCron.jar
SERVICE EMAIL LIBRARY JSTAF EXECUTE {STAF/Config/STAFRoot}/lib/STAFEmail.jar PARMS MAILSERVER mail.altibase.com 
SET MAXQUEUESIZE 10000
